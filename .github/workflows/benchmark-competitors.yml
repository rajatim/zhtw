name: Benchmark Competitor Environment

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/accuracy/competitor-env/**'
      - 'benchmarks/accuracy/competitors.lock.json'
      - 'benchmarks/accuracy/competitors-lock.schema.json'
      - 'scripts/container_competitors.py'
      - 'scripts/competitor_benchmark.py'
      - 'scripts/validate_competitor_environment.py'
      - 'scripts/run_ud_gsd_benchmark.py'
      - 'scripts/run_naer_terms_benchmark.py'
      - 'scripts/reproduce_public_benchmarks.py'
      - 'scripts/validate_public_benchmark_attestation.py'
      - 'benchmarks/accuracy/public-benchmark-reproduction-attestation.schema.json'
      - 'benchmarks/accuracy/external/ud-gsd-v1.json'
      - 'benchmarks/accuracy/external/naer-terms-v1.json'
      - 'benchmarks/accuracy/manifests/ud-gsd-v1.json'
      - 'benchmarks/accuracy/manifests/naer-terms-v1.json'
      - 'docs/reports/ud-gsd-benchmark-2026-07-31.json'
      - 'docs/reports/naer-terms-benchmark-2026-07-31.json'
      - '.github/workflows/benchmark-competitors.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/accuracy/competitor-env/**'
      - 'benchmarks/accuracy/competitors.lock.json'
      - 'benchmarks/accuracy/competitors-lock.schema.json'
      - 'scripts/container_competitors.py'
      - 'scripts/competitor_benchmark.py'
      - 'scripts/validate_competitor_environment.py'
      - 'scripts/run_ud_gsd_benchmark.py'
      - 'scripts/run_naer_terms_benchmark.py'
      - 'scripts/reproduce_public_benchmarks.py'
      - 'scripts/validate_public_benchmark_attestation.py'
      - 'benchmarks/accuracy/public-benchmark-reproduction-attestation.schema.json'
      - 'benchmarks/accuracy/external/ud-gsd-v1.json'
      - 'benchmarks/accuracy/external/naer-terms-v1.json'
      - 'benchmarks/accuracy/manifests/ud-gsd-v1.json'
      - 'benchmarks/accuracy/manifests/naer-terms-v1.json'
      - 'docs/reports/ud-gsd-benchmark-2026-07-31.json'
      - 'docs/reports/naer-terms-benchmark-2026-07-31.json'
      - '.github/workflows/benchmark-competitors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install validation dependencies
        run: uv sync --extra dev
      - name: Validate immutable environment inputs
        run: uv run python scripts/validate_competitor_environment.py
      - name: Build and probe every locked adapter
        run: make benchmark-competitor-probe
      - name: Run adapter tests
        run: uv run pytest tests/test_competitor_environment.py -q
      - name: Reproduce public secondary benchmark scores
        run: |
          uv run python scripts/run_ud_gsd_benchmark.py --generated-date 2026-07-31 --output-prefix /tmp/ud-gsd
          uv run python scripts/run_naer_terms_benchmark.py --generated-date 2026-07-31 --output-prefix /tmp/naer-terms
          diff <(jq -S .scores docs/reports/ud-gsd-benchmark-2026-07-31.json) <(jq -S .scores /tmp/ud-gsd.json)
          diff <(jq -S .scores docs/reports/naer-terms-benchmark-2026-07-31.json) <(jq -S .scores /tmp/naer-terms.json)
      - name: Verify public paired localization datasets
        run: make benchmark-paired-import-check
      - name: Run public paired localization comparisons
        run: |
          image="zhtw-benchmark-competitors:$(jq -r '.environment.environment_sha256' benchmarks/accuracy/competitors.lock.json | cut -c1-12)"
          for id in aosp-framework-paired-ui-v1 vscode-paired-ui-v1 firefox-paired-ui-v1; do
            uv run python scripts/run_paired_localization_benchmark.py \
              --manifest "benchmarks/accuracy/manifests/$id.json" \
              --engines zhtw,opencc-s2twp,zhconv-zh-tw \
              --container-image "$image" \
              --generated-date 2026-07-31 \
              --output-prefix "/tmp/$id"
          done
      - name: Smoke-test third-party reproduction package
        run: |
          uv run python scripts/reproduce_public_benchmarks.py \
            --operator github-actions \
            --organization rajatim/zhtw \
            --local-smoke-test \
            --output /tmp/zhtw-public-benchmark-attestation.json
          uv run python scripts/validate_public_benchmark_attestation.py \
            --allow-local-smoke-test \
            /tmp/zhtw-public-benchmark-attestation.json
