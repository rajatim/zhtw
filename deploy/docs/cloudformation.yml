AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 and CloudFront hosting for the public zhtw documentation site.

Parameters:
  DomainName:
    Type: String
    Default: zhtw.rajatim.com
    AllowedPattern: '^zhtw\.rajatim\.com$'
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  BucketName:
    Type: String
    Default: rajatim-zhtw-docs-381083412708-use1
    AllowedPattern: '^rajatim-zhtw-docs-[0-9]{12}-use1$'

Resources:
  DocsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RetainNoncurrentVersionsForRecovery
            Filter:
              Prefix: ''
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 365
              NewerNoncurrentVersions: 20

  DocsCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  DocsOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: zhtw-docs-s3-oac
        Description: Signed CloudFront access to the private zhtw docs bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DocsIndexRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: zhtw-docs-index-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve MkDocs directory URLs through the private S3 REST origin.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (!uri.substring(uri.lastIndexOf('/') + 1).includes('.')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  DocsCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: zhtw-docs-revalidate
        Comment: Revalidate public documentation so current content does not remain stale.
        DefaultTTL: 0
        MaxTTL: 300
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  DocsResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: zhtw-docs-security-headers
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true

  DocsDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
        Comment: Public zhtw bilingual product documentation.
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: !Ref DocsCachePolicy
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DocsIndexRewrite.FunctionARN
          ResponseHeadersPolicyId: !Ref DocsResponseHeadersPolicy
          TargetOriginId: zhtw-docs-s3
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 404
            ErrorCachingMinTTL: 0
            ResponseCode: 404
            ResponsePagePath: /404.html
        Origins:
          - DomainName: !GetAtt DocsBucket.RegionalDomainName
            Id: zhtw-docs-s3
            OriginAccessControlId: !Ref DocsOriginAccessControl
            OriginPath: /current
            S3OriginConfig:
              OriginAccessIdentity: ''
        PriceClass: PriceClass_200
        ViewerCertificate:
          AcmCertificateArn: !Ref DocsCertificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  DocsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${DocsBucket.Arn}/current/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DocsDistribution}'

  DocsPublisher:
    Type: AWS::IAM::User
    Properties:
      UserName: zhtw-docs-publisher
      Policies:
        - PolicyName: publish-exact-zhtw-docs-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListOnlyDocsPrefixes
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt DocsBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - current
                      - current/*
                      - releases
                      - releases/*
                      - deploy-state
                      - deploy-state/*
              - Sid: ReadDocsBucketConfiguration
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                Resource: !GetAtt DocsBucket.Arn
              - Sid: PublishDocsObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub '${DocsBucket.Arn}/current/*'
                  - !Sub '${DocsBucket.Arn}/releases/*'
                  - !Sub '${DocsBucket.Arn}/deploy-state/*'
              - Sid: InvalidateOnlyDocsDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetDistribution
                  - cloudfront:GetInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DocsDistribution}'
              - Sid: ReadOnlyDocsStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'

  DocsAliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt DocsDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  DocsAliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt DocsDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  BucketName:
    Value: !Ref DocsBucket
  DistributionId:
    Value: !Ref DocsDistribution
  DistributionDomainName:
    Value: !GetAtt DocsDistribution.DomainName
  PublisherUserName:
    Value: !Ref DocsPublisher
  PublicUrl:
    Value: !Sub 'https://${DomainName}'
